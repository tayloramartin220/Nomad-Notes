.atlas .main{min-width:0}
</style>

.atlas {
  --ink: #0f1620;
  --ink-2: #131c27;
  --panel: #182330;
  --panel-2: #1e2a38;
  --hairline: #2b3a49;
  --hairline-soft: #223141;
  --text: #edf1f5;
  --text-dim: #93a6b8;
  --text-faint: #5f7284;
  --brass: #c99a4b;
  --brass-bright: #e0b567;
  --brass-dim: #7a5f34;
  --teal: #5aab9e;
  --teal-dim: #2e4a45;
  --rust: #e0605a;
  --rust-dim: #5a2f2c;
  --amber: #e8a33d;
  --amber-bright: #f0b857;
  --amber-dim: #7a5a26;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  width: 100%;
  position: relative;
}
.atlas * { box-sizing: border-box; }
.atlas ::-webkit-scrollbar { width: 8px; height: 8px; }
.atlas ::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

.atlas .app-shell { display: flex; min-height: 100vh; }

/* ---- Sidebar ---- */
.atlas .sidebar {
  width: 216px; flex-shrink: 0; background: var(--ink-2);
  border-right: 1px solid var(--hairline-soft);
  display: flex; flex-direction: column; padding: 20px 12px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.atlas .brand { padding: 6px 10px 20px; }
.atlas .brand-mark { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--brass-bright); letter-spacing: 0.3px; }
.atlas .brand-sub { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1.6px; margin-top: 2px; }
.atlas .nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px;
  color: var(--text-dim); font-size: 13.2px; cursor: pointer; margin-bottom: 1px;
  border: 1px solid transparent; transition: all .12s ease;
}
.atlas .nav-item:hover { background: var(--panel); color: var(--text); }
.atlas .nav-item.active { background: var(--panel-2); color: var(--brass-bright); border-color: var(--hairline-soft); }
.atlas .nav-item svg { flex-shrink: 0; }
.atlas .nav-divider { height: 1px; background: var(--hairline-soft); margin: 12px 4px; }
.atlas .sidebar-foot { margin-top: auto; padding: 10px; font-size: 11px; color: var(--text-faint); }
.atlas .sample-btn {
  width: 100%; margin-top: 8px; padding: 7px 8px; font-size: 11.5px; border-radius: 6px;
  background: transparent; border: 1px dashed var(--hairline); color: var(--text-faint); cursor: pointer;
}
.atlas .sample-btn:hover { color: var(--rust); border-color: var(--rust-dim); }

/* ---- Main ---- */
.atlas .main { flex: 1; min-width: 0; padding: 28px 34px 60px; }
.atlas .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
.atlas .page-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
.atlas .page-sub { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
.atlas .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--brass); font-weight: 600; }

/* ---- Cards / panels ---- */
.atlas .card { background: var(--panel); border: 1px solid var(--hairline-soft); border-radius: 12px; padding: 18px 20px; }
.atlas .card-tight { padding: 14px 16px; }
.atlas .section-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin-bottom: 12px; display:flex; align-items:center; gap:8px;}
.atlas .grid { display: grid; gap: 16px; }
.atlas .grid-4 { grid-template-columns: repeat(4, 1fr); }
.atlas .grid-2 { grid-template-columns: repeat(2, 1fr); }
.atlas .grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1150px) { .atlas .grid-4 { grid-template-columns: repeat(2, 1fr);} }
.atlas .save-mobile { display: none; }
@media (max-width: 760px) { .atlas .save-mobile { display: block; } }
@media (max-width: 760px) { .atlas .grid-4, .atlas .grid-3, .atlas .grid-2 { grid-template-columns: 1fr; } }

/* ---- Stat / hero cards ---- */
.atlas .stat-card { position: relative; overflow: hidden; }
.atlas .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-faint); font-weight: 600; }
.atlas .stat-value { font-family: var(--font-display); font-size: 30px; font-weight: 600; margin-top: 6px; letter-spacing: -0.5px; }
.atlas .stat-value.brass { color: var(--brass-bright); }
.atlas .stat-value.teal { color: var(--teal); }
.atlas .stat-value.rust { color: var(--rust); }
.atlas .stat-foot { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }
.atlas .ticket-card {
  background: linear-gradient(135deg, var(--panel-2), var(--panel));
  border: 1px solid var(--hairline-soft); position: relative;
}
.atlas .ticket-card::after {
  content: ''; position: absolute; right: -9px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%; background: var(--ink);
  border: 1px solid var(--hairline-soft);
}
.atlas .perforation {
  border-top: 1px dashed var(--hairline); margin: 12px 0;
}

/* ---- Progress bars ---- */
.atlas .pbar { height: 8px; border-radius: 5px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--hairline-soft); }
.atlas .pbar-fill { height: 100%; background: linear-gradient(90deg, var(--brass-dim), var(--brass-bright)); border-radius: 5px; transition: width .3s ease; }
.atlas .pbar-fill.teal { background: linear-gradient(90deg, var(--teal-dim), var(--teal)); }
.atlas .pbar-fill.amber { background: linear-gradient(90deg, var(--amber-dim), var(--amber)); }
.atlas .pbar-fill.used { background: linear-gradient(90deg, var(--rust-dim), var(--rust)); }
.atlas .pbar-fill.rust { background: linear-gradient(90deg, var(--rust-dim), var(--rust)); }

/* ---- Buttons ---- */
.atlas .btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 7px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--hairline-soft);
  background: var(--panel-2); color: var(--text); transition: all .12s ease; white-space: nowrap;
}
.atlas .btn:hover { border-color: var(--brass-dim); }
.atlas .btn-primary { background: var(--brass); color: #201607; border-color: var(--brass); }
.atlas .btn-primary:hover { background: var(--brass-bright); }
.atlas .btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); padding: 6px 8px; }
.atlas .btn-ghost:hover { color: var(--text); background: var(--panel-2); }
.atlas .btn-danger { color: var(--rust); }
.atlas .btn-sm { padding: 5px 10px; font-size: 11.5px; }
.atlas .icon-btn { padding: 6px; border-radius: 6px; }

/* ---- Tables ---- */
.atlas table { width: 100%; border-collapse: collapse; font-size: 12.8px; color: var(--text); }
.atlas th { text-align: left; color: var(--text-faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 10px; border-bottom: 1px solid var(--hairline-soft); }
.atlas td { padding: 10px; border-bottom: 1px solid var(--hairline-soft); vertical-align: middle; }
.atlas tr:last-child td { border-bottom: none; }
.atlas tr:hover td { background: var(--panel-2); }

/* ---- Badges ---- */
.atlas .badge { display: inline-flex; align-items:center; gap:4px; padding: 3px 9px; border-radius: 100px; font-size: 10.8px; font-weight: 600; border: 1px solid; }
.atlas .badge-brass { color: var(--brass-bright); border-color: var(--brass-dim); background: rgba(201,154,75,0.08); }
.atlas .badge-teal { color: var(--teal); border-color: var(--teal-dim); background: rgba(90,171,158,0.08); }
.atlas .badge-amber { color: var(--amber-bright); border-color: var(--amber-dim); background: rgba(232,163,61,0.10); }
.atlas .badge-rust { color: var(--rust); border-color: var(--rust-dim); background: rgba(224,96,90,0.10); }
.atlas .badge-dim { color: var(--text-dim); border-color: var(--hairline); background: transparent; }

/* ---- Forms ---- */
.atlas .field { margin-bottom: 12px; display: block; }
.atlas .flabel { font-size: 11.5px; color: var(--text-dim); font-weight: 600; display: block; margin-bottom: 5px; }
.atlas input, .atlas select, .atlas textarea {
  width: 100%; background: var(--ink-2); border: 1px solid var(--hairline-soft); color: var(--text);
  padding: 8px 10px; border-radius: 6px; font-size: 13px; font-family: var(--font-body);
}
.atlas input:focus, .atlas select:focus, .atlas textarea:focus { outline: none; border-color: var(--brass-dim); }
.atlas textarea { resize: vertical; min-height: 60px; }

/* ---- Modal ---- */
.atlas .modal-overlay { position: fixed; inset: 0; background: rgba(6,10,14,0.72); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.atlas .modal { background: var(--panel); border: 1px solid var(--hairline-soft); border-radius: 14px; width: 560px; max-width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px 24px; }
.atlas .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.atlas .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; }

/* ---- Tabs (sub) ---- */
.atlas .subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline-soft); margin-bottom: 18px; flex-wrap: wrap; }
.atlas .subtab { padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.atlas .subtab.active { color: var(--brass-bright); border-color: var(--brass); }

/* ---- Opportunity card ---- */
.atlas .opp-card { background: var(--panel-2); border: 1px solid var(--hairline-soft); border-radius: 11px; padding: 16px 18px; }
.atlas .fit-ring { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; flex-shrink: 0; }
.atlas .kv-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; color: var(--text-dim); }
.atlas .kv-row b { color: var(--text); font-weight: 600; }
.atlas .tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.atlas .empty-state { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 13px; }
.atlas .needs-confirm { color: var(--rust); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.atlas .slider-track { -webkit-appearance: none; height: 4px; border-radius: 3px; background: var(--hairline); }
.atlas .slider-track::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--brass-bright); cursor: pointer; }
.atlas .mono { font-family: var(--font-mono); }
.atlas .link { color: var(--teal); text-decoration: none; font-size: 12px; display:inline-flex; align-items:center; gap:4px; }
.atlas .link:hover { text-decoration: underline; }
.atlas .checklist-item { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12.8px; }
.atlas .checklist-item input[type="checkbox"] { width: auto; flex: none; margin: 0; }
.atlas .spin { animation: atlas-spin 1s linear infinite; }
@keyframes atlas-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ---- v2 additions ---- */
.atlas button.nav-item { width: 100%; background: transparent; text-align: left; font-family: inherit; }
.atlas :focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
.atlas .banner { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 14px; border-radius:10px; border:1px solid var(--brass-dim); background: rgba(201,154,75,0.08); font-size:12.5px; margin-bottom:14px; }
.atlas .banner.warn { border-color: var(--rust-dim); background: rgba(224,96,90,0.10); }
.atlas .field-help { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
.atlas .form-errors { color: var(--rust); font-size: 12.5px; margin: 4px 0 10px; }
.atlas .form-warn { color: var(--brass-bright); font-size: 12.5px; margin: 4px 0 10px; }
.atlas textarea.mono-box { font-family: var(--font-mono); font-size: 11.5px; min-height: 120px; }
.atlas .step { display:flex; gap:10px; align-items:flex-start; margin: 14px 0 6px; }
.atlas .step-n { width:22px; height:22px; flex-shrink:0; border-radius:50%; border:1px solid var(--brass-dim); color:var(--brass-bright); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.atlas .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.atlas .meter { height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--hairline-soft); }
.atlas .meter > div { height: 100%; background: var(--teal); }
.atlas .meter.warn > div { background: var(--brass); }
.atlas .meter.bad > div { background: var(--rust); }
@media (max-width: 760px) {
  .atlas .app-shell { flex-direction: column; }
  .atlas .sidebar { position: static; width: 100%; height: auto; flex-direction: row; align-items: center; gap: 4px; overflow-x: auto; overflow-y: hidden; padding: 8px 10px; border-right: none; border-bottom: 1px solid var(--hairline-soft); }
  .atlas .brand { display: none; }
  .atlas button.nav-item { width: auto; flex-shrink: 0; padding: 8px 10px; }
  .atlas .nav-label { display: inline !important; font-size: 12px; white-space: nowrap; }
  .atlas .sidebar-foot { display: none; }
  .atlas .main { padding: 14px 16px 48px; }
  .atlas .modal { padding: 18px 16px; }
}

/* ---- Pastel theme ("blossom"): light, soft and rounded. Same tokens, new values. ---- */
.atlas { color-scheme: dark; }
.atlas[data-theme="blossom"] {
  color-scheme: light;
  --ink: #ffffff;
  --ink-2: #fbf8ff;
  --panel: #ffffff;
  --panel-2: #f8f4ff;
  --hairline: #e6dbf7;
  --hairline-soft: #efe8fb;
  --text: #3f3a58;
  --text-dim: #716c8c;
  --text-faint: #a09bb8;
  --brass: #cdb8f7;
  --brass-bright: #7448cc;
  --brass-dim: #dccfff;
  --teal: #1f8a73;
  --teal-dim: #bfe9dd;
  --rust: #c0392b;
  --rust-dim: #f7c3bb;
  --amber: #f0a830;
  --amber-bright: #9a5a06;
  --amber-dim: #f9d99a;
  --font-display: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, sans-serif;
  background: #ffffff;
}
.atlas[data-theme="blossom"] .sidebar { background: #ffffff; border-right-color: var(--hairline-soft); }
.atlas[data-theme="blossom"] .card { border-radius: 20px; background: #ffffff; border: 1.5px solid #e9defa; box-shadow: 0 6px 16px rgba(150,120,220,0.09); }
.atlas[data-theme="blossom"] .stat-card { background: #f4eeff; border-color: #dccfff; }
.atlas[data-theme="blossom"] .grid > .stat-card:nth-child(4n+2) { background: #eaf5ff; border-color: #c9e3fa; }
.atlas[data-theme="blossom"] .grid > .stat-card:nth-child(4n+3) { background: #ecf9f3; border-color: #c9ecdc; }
.atlas[data-theme="blossom"] .grid > .stat-card:nth-child(4n+4) { background: #fff7dc; border-color: #f9e6a3; }
.atlas[data-theme="blossom"] .stat-card.tone-teal:nth-child(n) { background: #ecf9f3; border-color: #c9ecdc; }
.atlas[data-theme="blossom"] .stat-card.tone-amber:nth-child(n) { background: #fff4dc; border-color: #f9dc9f; }
.atlas[data-theme="blossom"] .stat-card.tone-rust:nth-child(n) { background: #ffe9e5; border-color: #f7c3bb; }
.atlas .stat-card[class*="tone-"] .stat-value { font-weight: 800; }
.atlas[data-theme="blossom"] .tr-hover, .atlas[data-theme="blossom"] tr:hover td { background: #fbf8ff; }
.atlas[data-theme="blossom"] .nav-item:hover { background: #f6f3ff; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(1) svg { color: #8a6ad8; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(2) svg { color: #3b8fd0; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(3) svg { color: #2fa88a; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(4) svg { color: #d99a1e; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(5) svg { color: #e0709e; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(6) svg { color: #8a6ad8; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(7) svg { color: #3b8fd0; }
.atlas[data-theme="blossom"] .nav-item:nth-of-type(8) svg { color: #d99a1e; }
.atlas[data-theme="blossom"] .btn { background: #fff; border-color: #dccfff; }
.atlas[data-theme="blossom"] .btn-ghost { background: transparent; border-color: transparent; }
.atlas[data-theme="blossom"] .btn-primary { background: var(--brass); border-color: #a98be8; }
.atlas[data-theme="blossom"] .subtab.active { color: var(--brass-bright); border-color: var(--brass); }
.atlas[data-theme="blossom"] .step-n { border-color: #a9d3f5; color: #2f78b5; background: #eaf5ff; }
.atlas[data-theme="blossom"] .eyebrow { color: #2f78b5; }
.atlas[data-theme="blossom"] .btn { border-radius: 999px; }
.atlas[data-theme="blossom"] .btn-primary { color: #2e1a5c; box-shadow: 0 3px 0 #a98be8; }
.atlas[data-theme="blossom"] .nav-item { border-radius: 999px; }
.atlas[data-theme="blossom"] .nav-item.active { background: #efe6ff; color: var(--brass-bright); }
.atlas[data-theme="blossom"] .brand-mark { background: #efe6ff; color: var(--brass-bright); border-radius: 14px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }
.atlas[data-theme="blossom"] input, .atlas[data-theme="blossom"] select, .atlas[data-theme="blossom"] textarea { background: #fcfaff; border-color: #e6dbf7; }
.atlas[data-theme="blossom"] .badge { border-radius: 999px; }
.atlas[data-theme="blossom"] .badge-brass { background: #f1eaff; }
.atlas[data-theme="blossom"] .badge-teal { background: #e3f6f0; }
.atlas[data-theme="blossom"] .badge-rust { background: #ffe5e1; }
.atlas[data-theme="blossom"] .badge-amber { background: #fff1d6; }
.atlas[data-theme="blossom"] .pbar-fill.amber { background: linear-gradient(90deg, #fde6b0, #f6bd5a); }
.atlas[data-theme="blossom"] .banner { background: #eef7ff; border-color: #cde4f8; border-radius: 16px; }
.atlas[data-theme="blossom"] .banner.warn { background: #ffece8; border-color: var(--rust-dim); }
.atlas[data-theme="blossom"] .modal-overlay { background: rgba(74,58,82,0.35); }
.atlas[data-theme="blossom"] .modal { border-radius: 22px; }
.atlas[data-theme="blossom"] .pbar, .atlas[data-theme="blossom"] .meter { background: #eef2fb; }
.atlas[data-theme="blossom"] .pbar-fill { background: linear-gradient(90deg, #cfe8fb, #7fbff0); }
.atlas[data-theme="blossom"] .pbar-fill.teal { background: linear-gradient(90deg, #bfe9dd, #5cc4a8); }
.atlas[data-theme="blossom"] .pbar-fill.used { background: linear-gradient(90deg, #f2a79e, #d4564c); }
.atlas[data-theme="blossom"] .pbar-fill.rust { background: linear-gradient(90deg, #f8c6bd, #e8645a); }
.atlas[data-theme="blossom"] input, .atlas[data-theme="blossom"] select, .atlas[data-theme="blossom"] textarea { border-radius: 12px; }
.atlas[data-theme="blossom"] ::-webkit-scrollbar-thumb { background: #d9c9f7; }
